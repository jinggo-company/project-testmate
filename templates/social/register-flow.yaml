# Social: Register Flow
# 社交 - 用户注册流程

appId: com.social.app
---
- launchApp
- tapOn: "注册"
- assertVisible: "创建账号"
- tapOn: "手机号"
- inputText: "13900139000"
- tapOn: "获取验证码"
- tapOn: "验证码"
- inputText: "654321"
- tapOn: "设置昵称"
- inputText: "TestUser"
- tapOn: "完成注册"
- assertVisible: "欢迎"
- takeScreenshot: register-success
